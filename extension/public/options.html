<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT Pre-Match Scout - Options</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #1a1a2e; color: #e0e0e0; min-width: 400px; }
    h1 { font-size: 18px; margin-bottom: 16px; color: #e94560; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #2a2a4a; border-radius: 4px; background: #16213e; color: #e0e0e0; font-size: 13px; }
    input:focus { outline: none; border-color: #e94560; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .checkbox-row input { accent-color: #e94560; }
    button { background: #e94560; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button:hover { background: #ff6b81; }
    button.secondary { background: #2a2a4a; }
    button.secondary:hover { background: #3a3a5a; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .status { font-size: 12px; margin-top: 8px; min-height: 18px; }
    .status.ok { color: #4caf50; }
    .status.error { color: #e94560; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="options.js"></script>
</body>
</html>
