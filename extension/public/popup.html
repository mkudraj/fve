<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT Pre-Match Scout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 320px; padding: 12px; background: #1a1a2e; color: #e0e0e0; }
    button { background: #e94560; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button:hover { background: #ff6b81; }
    button:disabled { opacity: 0.5; cursor: default; }
    h2 { font-size: 14px; margin-bottom: 8px; color: #e94560; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; border-bottom: 1px solid #2a2a4a; }
    .label { color: #888; }
    .value { color: #e0e0e0; font-weight: 500; }
    .error { color: #e94560; font-size: 11px; margin-top: 4px; }
    .section { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
